# Twin negatives of the points-to positives (plan V3). Each test builds and
# runs its program with the NoAlias facts checked at run time, so it needs the
# same host as points-to/runtime: REQUIRES native, system-linux, x86_64.
import os

if not (
    "native" in config.available_features
    and "system-linux" in config.available_features
    and config.target_triple.startswith("x86_64")
):
    config.unsupported = True

# %pt_run <src> <out-prefix> [instrument options...]
#   pt-run.sh with the program's external part (#ifdef PT_EXTERNAL) compiled
#   from the same source, without CIR, and linked in. $CXXFLAGS (the -DTWIN_*
#   macro) goes to both compiles. The table is <out-prefix>.table; the run's
#   stderr (PT-CHECKS, PT-VIOLATION) is printed on stderr.
# %pt_opts: check every NoAlias pair and list the other candidates too.
pt_run_sh = os.path.join(
    config.test_source_root, "CIR", "Analysis", "points-to", "Inputs", "pt-run.sh"
)
config.substitutions.append(
    ("%pt_run", "env PT_SELF_EXTERNAL=-DPT_EXTERNAL bash " + pt_run_sh)
)
config.substitutions.append(("%pt_opts", "max-pairs-per-func=0 print-candidates=1"))
